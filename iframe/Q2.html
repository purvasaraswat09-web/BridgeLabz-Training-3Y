<!DOCTYPE html>
<html>
<head>
    <title>My City Map</title>
</head>
<body>

    <h1>My City - Google Map</h1>

    <!-- loading="lazy" loads the map only when it is close to being visible -->
    <iframe
        src="https://www.google.com/maps?q=Delhi,India&output=embed"
        title="Google Map showing Delhi"
        width="80%"
        height="450"
        loading="lazy">
    </iframe>

</body>
</html>
